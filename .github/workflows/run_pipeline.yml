name: Run CFO Master Pipeline

on:
  # 1. Triggered on demand by Make.com when files are added or deleted
  repository_dispatch:
    types: [trigger-pipeline]
  workflow_dispatch:

  # 2. Runs automatically every day at 6:00 AM UTC even if nothing changed
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl gdown requests

      - name: Clean Old Data and Download Current Files from Google Drive
        run: |
          rm -rf ./data
          mkdir -p ./data
          # Downloads current state of the folder (handles added/deleted files)
          gdown --folder https://drive.google.com/drive/folders/1uWk690Cg2I2wJsSq_e-uA32l3B8Vuko_ -O ./data/

      - name: Run Accounts Calculation Script
        run: |
          python Accounts.py

      - name: Commit and Push Updated Report to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CFO_Daily_Master_Report.xlsx
          git diff-index --quiet HEAD || git commit -m "Automated update: CFO Master Report"
          git push
