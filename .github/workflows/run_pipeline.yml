name: Run CFO Master Pipeline

on:
  repository_dispatch:
    types: [trigger-pipeline]
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install pandas openpyxl gdown requests

      - name: Download Raw Data from Google Drive Folder
        run: |
          # Downloads all files from your public Accounts Data Automation folder
          gdown --folder https://drive.google.com/drive/folders/1uWk690Cg2I2wJsSq_e-uA32l3B8Vuko_ -O ./data/

      - name: Run Accounts Calculation Script
        run: |
          python Accounts.py

      - name: Commit and Push Updated Master Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CFO_Daily_Master_Report.xlsx
          git diff-index --quiet HEAD || git commit -m "Automated update: CFO Master Report"
          git push
