name: Run CFO Master Pipeline

on:
  repository_dispatch:
    types: [trigger-pipeline]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl "gdown>=5.0.0" requests

      - name: Download Files from Google Drive
        run: |
          rm -rf ./data
          python download_data.py
          
          # Flatten nested folder if gdown created a subfolder
          find ./data -mindepth 2 -type f \( -name "*.xlsx" -o -name "*.csv" \) -exec mv -f {} ./data/ \;
          echo "Files ready in ./data/:"
          ls -la ./data/

      - name: Run Accounts Calculation Script
        run: |
          python Accounts.py

      - name: Commit and Push Updated Report to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "CFO_Daily_Master_Report.xlsx" ]; then
            git add CFO_Daily_Master_Report.xlsx
            if ! git diff-index --quiet HEAD; then
              git commit -m "Automated update: CFO Master Report [skip ci]"
              git pull --rebase
              git push
            else
              echo "No changes detected in CFO_Daily_Master_Report.xlsx."
            fi
          else
            echo "Error: CFO_Daily_Master_Report.xlsx was not generated."
            exit 1
          fi
