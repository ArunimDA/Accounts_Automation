name: Run CFO Master Pipeline

on:
  repository_dispatch:
    types: [trigger-pipeline]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Run Accounts Calculation Script
        run: |
          python Accounts.py

      - name: Commit and Push Master Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          ls -la
          
          if [ -f "CFO_Daily_Master_Report.xlsx" ]; then
            git add -f CFO_Daily_Master_Report.xlsx
            git commit -m "Automated update: CFO Master Report" || echo "No changes to commit"
            git push origin main
          else
            echo "Error: CFO_Daily_Master_Report.xlsx was not created by Accounts.py"
            exit 1
          fi
