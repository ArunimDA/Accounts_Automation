name: Run CFO Master Pipeline

on:
  repository_dispatch:
    types: [trigger-pipeline]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pandas openpyxl requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Data from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python download.py

      - name: Run Accounts Calculation Script
        run: |
          python Accounts.py

      - name: Commit and Push Master Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CFO_Daily_Master_Report.xlsx
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: CFO_Daily_Master_Report.xlsx"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Trigger Make.com Webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.MAKE_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "success", "report": "CFO_Daily_Master_Report.xlsx"}'
